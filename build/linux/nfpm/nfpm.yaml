# nfpm config for Silt Linux packages (.deb / .rpm / .archlinux).
# Consumed by `wails3 tool package` via build/linux/Taskfile.yml. This is the
# single packaging-definition source of truth — build-linux.sh delegates to
# `wails3 task linux:package` rather than rolling its own dpkg-deb/appimagetool.
# See https://nfpm.goreleaser.com for the schema.
#
# Stack: GTK3 + WebKit2GTK 4.1 (the v3 `gtk3` build tag, passed as
# EXTRA_TAGS=gtk3 by build-linux.sh). wails3 v3's gtk3 path pkg-configs
# webkit2gtk-4.1 specifically — webkit2gtk-4.0 is not supported — and Ubuntu
# 24.04+ ships 4.1 only. The runtime deps below mirror that.

name: "silt"
arch: ${GOARCH}
platform: "linux"
version: ${VERSION}
section: "office"
priority: "optional"
maintainer: "Chelydra Labs <turtle@chelydra.dev>"
description: "Local-first hybrid journal and task manager"
vendor: "Chelydra Labs"
homepage: "https://github.com/Chelydra-Labs/Silt"
license: "MIT"
release: "1"

contents:
  - src: "./build/bin/silt"
    dst: "/usr/local/bin/silt"
  - src: "./build/appicon.png"
    dst: "/usr/share/icons/hicolor/1024x1024/apps/silt.png"
  - src: "./build/linux/silt.desktop"
    dst: "/usr/share/applications/silt.desktop"

# GTK3 + WebKit2GTK 4.1 runtime deps — match the `gtk3` build tag.
depends:
  - libgtk-3-0
  - libwebkit2gtk-4.1-0

# Distribution-specific package names for the same GTK3 + WebKit2GTK 4.1 stack.
overrides:
  rpm:
    depends:
      - gtk3
      - webkit2gtk4.1
  archlinux:
    depends:
      - gtk3
      - webkit2gtk-4.1

# Refresh the desktop database after install so the menu entry appears.
scripts:
  postinstall: "./build/linux/nfpm/scripts/postinstall.sh"
