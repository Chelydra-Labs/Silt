name: CI

# Mirrors the local .githooks/pre-push gates so PRs are gated even when a
# contributor has not installed the hooks locally.
#
# Layout (wall-clock optimized, same gates as the former monolithic job):
#   frontend  — vite build + svelte-check + Vitest (parallel)
#   go-test   — go build/vet/race + inventory + withAIPreflight (parallel)
#   wails-smoke — full wails3 build (always on main; path-filtered on PRs)
#   build-and-test — aggregator with the historical required-check name
#   security  — govulncheck + npm audit + gitleaks (unchanged, parallel)
#
# Note on generated assets: both `frontend/dist/` (vite) and
# `frontend/bindings/` (Go→JS stubs) are gitignored. Jobs that need them
# regenerate them; go-test only needs a non-empty dist for //go:embed.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Shared apt package set for Wails v3 CGO (GTK4 + WebKitGTK 6.0).
  WEBVIEW_APT_PACKAGES: libgtk-4-dev libwebkitgtk-6.0-dev libsoup-3.0-dev

jobs:
  # -------------------------------------------------------------------------
  # Path filter — decides whether the Wails smoke is needed on this PR.
  # Always "true" on push-to-main so main never skips the full pipeline.
  # -------------------------------------------------------------------------
  changes:
    name: Detect app-relevant paths
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # On push events (main), force app=true so smoke always runs.
          # paths-filter still evaluates; we OR with event_name below.
          filters: |
            app:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'frontend/**'
              - 'build/**'
              - 'wails.json'
              - 'Taskfile.yml'
              - 'Taskfile.yaml'
              - '**/Taskfile.yml'
              - '.github/workflows/ci.yml'
              - 'VERSION'

  # -------------------------------------------------------------------------
  # Frontend: bindings + vite + typecheck + unit tests
  # -------------------------------------------------------------------------
  frontend:
    name: Frontend (build + check + vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux webview dependencies
        # wails3 generate bindings (npm prepare) loads Wails CGO packages.
        uses: awalsh128/cache-apt-pkgs-action@v1.6.3
        with:
          packages: ${{ env.WEBVIEW_APT_PACKAGES }}
          version: webview-1

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Resolve Wails CLI version
        id: wails-ver
        run: |
          WAILS_VERSION=$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3)
          echo "version=$WAILS_VERSION" >> "$GITHUB_OUTPUT"

      - name: Cache Wails CLI
        id: wails-cache
        uses: actions/cache@v4
        with:
          path: ~/go/bin/wails3
          key: wails3-${{ runner.os }}-${{ steps.wails-ver.outputs.version }}

      - name: Install Wails CLI
        if: steps.wails-cache.outputs.cache-hit != 'true'
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@${{ steps.wails-ver.outputs.version }}

      - name: Install frontend dependencies
        working-directory: frontend
        # npm install (not ci): lockfile is often generated on Windows and may
        # omit Linux optional deps (e.g. @esbuild/linux-x64). prepare regenerates
        # frontend/bindings/ from live Go App signatures.
        run: npm install

      - name: Build frontend (vite)
        working-directory: frontend
        run: npm run build

      - name: svelte-check
        working-directory: frontend
        run: npm run check

      - name: Frontend unit tests (Vitest)
        working-directory: frontend
        run: npm test

  # -------------------------------------------------------------------------
  # Go: compile, static analysis, race tests (no full Wails app link)
  # -------------------------------------------------------------------------
  go-test:
    name: Go (build + vet + race)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux webview dependencies
        uses: awalsh128/cache-apt-pkgs-action@v1.6.3
        with:
          packages: ${{ env.WEBVIEW_APT_PACKAGES }}
          version: webview-1

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Seed frontend/dist for go:embed
        # main.go embeds all:frontend/dist. Real assets are not required for
        # unit tests / go build of packages; a non-empty dir satisfies embed.
        run: mkdir -p frontend/dist && touch frontend/dist/.gitkeep

      - name: Build Go
        run: go build ./...

      - name: go vet
        run: go vet ./...

      - name: Binding parity check
        # Exact comparison against cmd/inventory/current-approved-v3.json.
        # Deliberate IPC surface changes must regenerate the fixture in-PR:
        #   go run -tags tools ./cmd/inventory/ -update cmd/inventory/current-approved-v3.json
        run: go run -tags tools ./cmd/inventory/ -compare cmd/inventory/current-approved-v3.json

      - name: withAIPreflight defer-contract analyzer
        run: |
          go build -tags tools -o ./.gobins/withaipreflightdefer ./cmd/withaipreflightdefer
          go vet -vettool=./.gobins/withaipreflightdefer ./...

      - name: Test with race detector
        run: go test -race -count=1 ./...

  # -------------------------------------------------------------------------
  # Full Wails pipeline smoke (bindings + frontend + native binary)
  # -------------------------------------------------------------------------
  wails-smoke:
    name: Wails3 build smoke
    needs: [changes]
    # Always on push-to-main; on PRs only when app-relevant paths changed.
    if: >
      github.event_name == 'push' ||
      needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux webview dependencies
        uses: awalsh128/cache-apt-pkgs-action@v1.6.3
        with:
          packages: ${{ env.WEBVIEW_APT_PACKAGES }}
          version: webview-1

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Resolve Wails CLI version
        id: wails-ver
        run: |
          WAILS_VERSION=$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3)
          echo "version=$WAILS_VERSION" >> "$GITHUB_OUTPUT"

      - name: Cache Wails CLI
        id: wails-cache
        uses: actions/cache@v4
        with:
          path: ~/go/bin/wails3
          key: wails3-${{ runner.os }}-${{ steps.wails-ver.outputs.version }}

      - name: Install Wails CLI
        if: steps.wails-cache.outputs.cache-hit != 'true'
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@${{ steps.wails-ver.outputs.version }}

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Wails3 build smoke test
        # Full v3 pipeline (Taskfile + bindings + frontend + Go binary).
        run: wails3 build

  # -------------------------------------------------------------------------
  # Aggregator — keeps the historical required-check name for branch protection.
  # -------------------------------------------------------------------------
  build-and-test:
    name: Build & test (Go -race + frontend check/build)
    needs: [frontend, go-test, wails-smoke]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require frontend + go-test; allow skipped wails-smoke
        run: |
          set -euo pipefail
          fe="${{ needs.frontend.result }}"
          gt="${{ needs.go-test.result }}"
          ws="${{ needs.wails-smoke.result }}"
          echo "frontend=$fe go-test=$gt wails-smoke=$ws"
          if [ "$fe" != "success" ]; then
            echo "::error::Frontend job failed ($fe)"
            exit 1
          fi
          if [ "$gt" != "success" ]; then
            echo "::error::Go test job failed ($gt)"
            exit 1
          fi
          # skipped = path filter on PR; success = ran and passed
          if [ "$ws" != "success" ] && [ "$ws" != "skipped" ]; then
            echo "::error::Wails smoke job failed ($ws)"
            exit 1
          fi
          echo "All required CI lanes green."

  # F8 (#242): dependency + secret scanning. Runs parallel to build lanes.
  #
  # IMPORTANT: this job MUST be added to the "required status checks" list in
  # GitHub branch protection (Settings → Branches → main → Require status
  # checks). The job name below is what to look for in the picker.
  security:
    name: Dependency + secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # gitleaks needs full history

      - name: Install Linux webview dependencies
        # govulncheck analyzes Wails v3's CGO packages, which need the same
        # GTK4 / WebKitGTK 6.0 dev headers as the build jobs.
        uses: awalsh128/cache-apt-pkgs-action@v1.6.3
        with:
          packages: ${{ env.WEBVIEW_APT_PACKAGES }}
          version: webview-1

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Cache govulncheck
        id: govuln-cache
        uses: actions/cache@v4
        with:
          path: ~/go/bin/govulncheck
          key: govulncheck-${{ runner.os }}-${{ hashFiles('go.mod') }}

      - name: govulncheck (reachable vulnerabilities)
        run: |
          if [ ! -x "$(go env GOPATH)/bin/govulncheck" ]; then
            go install golang.org/x/vuln/cmd/govulncheck@latest
          fi
          $(go env GOPATH)/bin/govulncheck ./...

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm audit (prod tree, high+critical)
        working-directory: frontend
        run: |
          npm install
          npm audit --omit=dev --audit-level=high

      - name: gitleaks (secrets in full history)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo gitleaks/gitleaks --pattern "gitleaks_*_linux_x64.tar.gz" --output /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp
          chmod +x /tmp/gitleaks
          /tmp/gitleaks detect --source . --no-banner --verbose --redact
